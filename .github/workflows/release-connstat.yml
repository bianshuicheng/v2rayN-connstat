name: release connstat packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish to, e.g. v7.24.9-connstat'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows, arch: x64,   rid: win-x64,     os: windows-latest, project: './v2rayN/v2rayN.csproj',                 ext: '-p:EnableWindowsTargeting=true' }
          - { target: windows, arch: arm64, rid: win-arm64,   os: windows-latest, project: './v2rayN/v2rayN.csproj',                 ext: '-p:EnableWindowsTargeting=true' }
          - { target: linux,   arch: x64,   rid: linux-x64,   os: ubuntu-24.04,   project: './v2rayN.Desktop/v2rayN.Desktop.csproj', ext: '' }
          - { target: linux,   arch: arm64, rid: linux-arm64, os: ubuntu-24.04,   project: './v2rayN.Desktop/v2rayN.Desktop.csproj', ext: '' }
          - { target: macos,   arch: x64,   rid: osx-x64,     os: macos-latest,   project: './v2rayN.Desktop/v2rayN.Desktop.csproj', ext: '' }
          - { target: macos,   arch: arm64, rid: osx-arm64,   os: macos-latest,   project: './v2rayN.Desktop/v2rayN.Desktop.csproj', ext: '' }
    runs-on: ${{ matrix.os }}
    env:
      PKG_TARGET: ${{ matrix.target }}
      PKG_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.1xx

      - name: Build v2rayN
        shell: bash
        working-directory: ./v2rayN
        run: dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }} -p:SelfContained=true ${{ matrix.ext }} -o output

      - name: Build AmazTool
        shell: bash
        working-directory: ./v2rayN
        run: dotnet publish ./AmazTool/AmazTool.csproj -c Release -r ${{ matrix.rid }} -p:SelfContained=true -p:PublishTrimmed=true ${{ matrix.ext }} -o output

      - name: Remove debug symbols
        shell: bash
        run: find output -type f -name '*.pdb' -delete

      - name: Compute package name
        shell: bash
        run: |
          case "${PKG_TARGET}-${PKG_ARCH}" in
            windows-x64)   name=v2rayN-windows-64 ;;
            windows-arm64) name=v2rayN-windows-arm64 ;;
            linux-x64)     name=v2rayN-linux-64 ;;
            linux-arm64)   name=v2rayN-linux-arm64 ;;
            macos-x64)     name=v2rayN-macos-64 ;;
            macos-arm64)   name=v2rayN-macos-arm64 ;;
            *) echo "unknown target/arch: ${PKG_TARGET}-${PKG_ARCH}"; exit 1 ;;
          esac
          echo "PKG_NAME=${name}" >> "$GITHUB_ENV"

      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path output/* -DestinationPath "$env:PKG_NAME.zip" -CompressionLevel Fastest

      - name: Package zip (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd output
          zip -9 -r "../${PKG_NAME}.zip" .
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ env.PKG_NAME }}.zip
          if-no-files-found: error

  release:
    name: upload to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: pkgs

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "v2rayN 7.24.9 + connstat 补丁 多平台自动构建（免签名版）。Windows 包含「Xray 连接」标签页；linux/macos 为 v2rayN.Desktop（Avalonia）界面，不含该标签页。"
          gh release upload "$TAG" pkgs/*.zip --clobber
          echo "done"
